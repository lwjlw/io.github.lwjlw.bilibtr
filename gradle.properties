# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 开发期把堆调大。Compose + AGP 9 + R8 在 2048m 下容易 OutOfMemoryError，
# 或者慢到让人误以为卡死。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# 单模块项目开并行收益有限，但无害，且能加快依赖解析与资源处理。
org.gradle.parallel=true

# 关闭配置缓存。
# 模板（Gradle 9）默认开启了它，但对本项目的两类工作不友好：
#   1) LSPosed 模块大量使用动态反射；
#   2) 需要把 META-INF/xposed/* 原样打进 APK，属于构建期资源改写。
# 配置缓存对这些任务的序列化要求苛刻，典型症状是报
# "Cannot serialize object of type ..."，或更隐蔽的"构建成功但三件套没进包"。
# 等打包验证稳定后可以再考虑打开。
org.gradle.configuration-cache=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# 只生成当前模块自己的 R 类，减小方法数与构建体积。
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
